# 団員アプリ（kco-member-app）と応募者管理の Apps Script（orchestra-management）のテストと自動公開
#
#  ・プルリクエスト：テストだけ実行（公開しない・秘密情報は使わない）
#  ・main に入ったとき：テストがすべて通ったら Firebase（kanagawa-connect-official）へ公開
#    ※ Apps Script は自動では反映されません（エディタに貼り付けて更新）
#
# 公開には GitHub の Secrets に FIREBASE_SERVICE_ACCOUNT_MEMBER_APP（サービスアカウントの JSON 鍵）が必要です。
# 鍵はリポジトリに書かず、Secrets にだけ保存します（手順は README.md の「自動公開の設定」）。
name: 団員アプリ

on:
  pull_request:
    paths:
      - 'kco-member-app/**'
      - 'orchestra-management/**'
      - '.github/workflows/member-app.yml'
  push:
    branches: [main]
    paths:
      - 'kco-member-app/**'
      - 'orchestra-management/**'
      - '.github/workflows/member-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spreadsheet:
    name: 応募者管理（Apps Script）のテスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: orchestra-management
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run-tests.js
      - run: node test/appsync-tests.js
      - run: node test/membership-tests.js

  app:
    name: 団員アプリのテストと公開
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: spreadsheet
    defaults:
      run:
        working-directory: kco-member-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kco-member-app/package-lock.json

      # Firebase エミュレータ（ルールのテスト）に Java が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: 単体テスト
        run: npm test
      - name: セキュリティルールのテスト（エミュレータ）
        run: npm run test:rules
      - name: ビルド
        run: npx vite build

      # ---- ここから下は main に入ったときだけ ----
      - name: 公開用の鍵があるか確認
        if: github.event_name != 'pull_request'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMBER_APP }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GitHub の Secrets に FIREBASE_SERVICE_ACCOUNT_MEMBER_APP がありません。README.md の「自動公開の設定」を参照してください。"
            exit 1
          fi

      - name: Google Cloud にログイン（サービスアカウント）
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMBER_APP }}

      - name: Firebase に公開（アプリ・ルール・インデックス）
        if: github.event_name != 'pull_request'
        run: npx firebase deploy --only hosting,firestore --project kanagawa-connect-official --non-interactive
